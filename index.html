function blitz(nopush,gid){gid=gid||'';if(!nopush)go('blitz',gid);const all=Object.values(ALL).filter(c=>c.ru!=='В чём разница?');const g=gid&&findG(gid);const src=g?g.cards.filter(c=>c.ru!=='В чём разница?'):all;const pool=src.length>=8?src:all;

 const NOTES=PARTS+`${c.det?`<div class="note det">${esc(c.det)}</div>`:''}${c.syn?`<div class="note syn">${esc(c.syn)}</div>`:''}${c.ant?`<div class="note ant">${esc(c.ant)}</div>`:''}${c.ref?`<div class="ref">📄 ${esc(c.ref)}</div>`:''}${exHtml(c)}`;
