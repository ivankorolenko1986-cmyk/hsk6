const isDue=c=>!S.due[c.id]||S.due[c.id]<=today();
const esc=s=>(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function hl(sent,key){let s=esc(sent);key.split(/\s*\/\s*/).filter(Boolean).sort((a,b)=>b.length-a.length).forEach(k=>{s=s.split(esc(k)).join('<b>'+esc(k)+'</b>')});return s}
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/[／/…（）()“”"]/g,' '));u.lang='zh-CN';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const app=document.getElementById('app');
let queue=[],cur=null,shown=false,deckSel=null;
function tabs(){return window.HSK?`<div class="seg" id="tab" style="margin-bottom:12px"><button data-t="my" class="${S.tab!='hsk'?'on':''}">📄 Мои договоры</button><button data-t="hsk" class="${S.tab=='hsk'?'on':''}">🎓 HSK 6 · экзамен</button></div>`:''}
function bindTabs(){app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;save();home()})}
function home(){deckSel=null;if(window.HSK&&S.tab==='hsk'){HSK.hub();return}
 const dueAll=Object.values(ALL).filter(isDue).length;
 let h=tabs()+`<div class="seg" id="dir"><button data-d="ru" class="${S.dir=='ru'?'on':''}">Русский → 中文</button><button data-d="zh" class="${S.dir=='zh'?'on':''}">中文 → Русский</button><button data-d="mix" class="${S.dir=='mix'?'on':''}">🔀 Вперемешку</button></div>
 <div class="row" style="margin-top:12px"><button class="go" style="--c:#8E1B1B;flex:1;padding:12px" id="allBtn">Повторить всё, что пора · ${dueAll}</button></div>
 <div class="row"><button class="go" style="--c:#B0702A;flex:1;padding:12px" id="blitzBtn">⚡ Блиц-опрос · 20 вопросов</button></div>`;
 DECKS.forEach(d=>{const n=d.cards.length,k=d.cards.filter(known).length,due=d.cards.filter(isDue).length;
  h+=`<div class="deck" style="--c:${d.color}"><div style="flex:1"><div class="t">${esc(d.title)}</div><div class="n">${n} карточек · выучено ${k} · пора повторить ${due}</div><div class="bar"><i style="width:${Math.round(100*k/n)}%"></i></div></div><button class="go" data-deck="${d.id}">Учить</button></div>`});
 h+=`<div class="help"><b>Как пользоваться.</b> Смотрите на карточку и вспоминайте перевод, потом нажмите «Показать». «Знаю» — карточка вернётся через 1, 3, 7, 14, 30 дней; «Не знаю» — сегодня ещё раз. 🔊 — произношение. Прогресс хранится в этом телефоне.<br><br><b>Как поставить на телефон:</b> откройте в Chrome → ⋮ → «Добавить на главный экран».</div>`;
 app.innerHTML=h;
 bindTabs();app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.dir=b.dataset.d;save();home()});
 app.querySelectorAll('[data-deck]').forEach(b=>b.onclick=()=>start(b.dataset.deck));
 document.getElementById('allBtn').onclick=()=>start('');document.getElementById('blitzBtn').onclick=()=>blitz();
 scrollTo(0,0)}
function start(id,nopush){if(!nopush)go('deck',id);deckSel=id;const pool=id?DECKS.find(d=>d.id==id).cards:Object.values(ALL);
 let q=pool.filter(isDue);if(!q.length)q=pool.slice();
 queue=q.sort(()=>Math.random()-.5);next()}
function next(){if(!queue.length){app.innerHTML=`<div class="card" style="text-align:center"><div class="zh">太好了！</div><p>Карточки на сегодня закончились.</p><button class="go" style="--c:#8E1B1B" onclick="history.back()">К темам</button></div>`;return}
 cur=queue.shift();shown=false;draw()}
function exHtml(c){if(!c.ex||!c.ex.length)return'';return `<div class="ex"><div class="lbl">ещё примеры</div>${c.ex.map(e=>`<div class="exi"><div class="r">${esc(e[1])}</div><div class="z">${hl(e[0],c.zh)}</div>${e[2]?`<div class="pyl">${esc(e[2])}</div>`:''}</div>`).join('')}</div>`}
let BZ=null;
function blitz(nopush){if(!nopush)go('blitz');const pool=Object.values(ALL).filter(c=>c.ru!=='В чём разница?');
 const qs=pool.slice().sort(()=>Math.random()-.5).slice(0,20).map(c=>{const dir=Math.random()<.5?'ru':'zh';
  const others=pool.filter(o=>o!==c&&o.zh!==c.zh&&o.ru!==c.ru).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[c,...others].sort(()=>Math.random()-.5);return{c,dir,opts}});
 BZ={qs,i:0,ok:0,wrong:[]};bzDraw()}
let bzTimer=null;
function bzDraw(){clearInterval(bzTimer);const q=BZ.qs[BZ.i];if(!q){return bzEnd()}
 const c=q.c,ruQ=q.dir=='ru';let left=10;
 const qhtml=ruQ?`<div class="lbl">как по-китайски?</div><div class="ru">${esc(c.ru)}</div>${(S.en!==false&&c.en)?`<div class="en">${esc(c.en)}</div>`:''}`
  :`<div class="lbl">что значит?</div><div class="zh">${esc(c.zh)}</div><div class="py">${esc(c.py)}</div>`;
 app.innerHTML=`<div class="top"><span style="font-weight:600;color:#B0702A">⚡ Блиц · ${BZ.i+1}/${BZ.qs.length}</span><span>✓ ${BZ.ok} · <b id="tm">10</b> с</span></div>
 <div class="bar"><i id="tb" style="width:100%;background:#B0702A;transition:width 1s linear"></i></div>
 <div class="card" style="--c:${c.deck.color};min-height:auto">${qhtml}</div>
 <div id="opts">${q.opts.map((o,k)=>`<button class="ghost" data-o="${k}" style="display:block;width:100%;margin:8px 0;padding:12px;text-align:left;font-size:calc(var(--k)*${ruQ?20:16}px);background:#fff">${ruQ?esc(o.zh)+` <span class="py" style="font-size:.6em">${esc(o.py)}</span>`:esc(o.ru)}</button>`).join('')}</div>`;
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>bzAnswer(+b.dataset.o));
 bzTimer=setInterval(()=>{left--;const tm=document.getElementById('tm'),tb=document.getElementById('tb');if(tm)tm.textContent=left;if(tb)tb.style.width=(left*10)+'%';if(left<=0)bzAnswer(-1)},1000)}
function bzAnswer(k){clearInterval(bzTimer);const q=BZ.qs[BZ.i],right=q.opts.indexOf(q.c);
 app.querySelectorAll('[data-o]').forEach((b,i)=>{b.onclick=null;if(i===right){b.style.background='#E4F1E7';b.style.borderColor='#3D7A4E'}else if(i===k){b.style.background='#FBEDED';b.style.borderColor='#B4413C'}});
 if(k===right){BZ.ok++}else{BZ.wrong.push(q.c);S.box[q.c.id]=0;S.due[q.c.id]=0;save()}
 const c=q.c;const box=document.createElement('div');box.className='card';box.style.minHeight='auto';box.style.marginTop='8px';
 box.innerHTML=`<div class="zh" style="font-size:calc(var(--k)*24px)">${esc(c.zh)} <span class="py" style="font-size:.55em">${esc(c.py)}</span></div><div class="ru" style="font-size:calc(var(--k)*16px)">${esc(c.ru)}</div>${c.zs?`<div class="zs" style="font-size:calc(var(--k)*15px)">${hl(c.zs,c.zh)}</div><div class="pyl">${esc(c.zsp)}</div>`:''}<button class="go" style="--c:#B0702A;width:100%;margin-top:10px;padding:12px" id="nx">${BZ.i+1<BZ.qs.length?'Дальше →':'Итог'}</button>`;
 app.appendChild(box);document.getElementById('nx').onclick=()=>{BZ.i++;bzDraw()};box.scrollIntoView({block:'nearest'})}
function bzEnd(){const n=BZ.qs.length,p=Math.round(100*BZ.ok/n);
 app.innerHTML=`<div class="card" style="text-align:center;min-height:auto"><div class="zh">${p>=80?'太棒了！':p>=50?'不错！':'加油！'}</div><div class="ru">${BZ.ok} из ${n} · ${p}%</div>
 ${BZ.wrong.length?`<div class="lbl" style="margin-top:12px">Ошибки — добавлены в повторение на сегодня</div>${BZ.wrong.map(c=>`<div class="li" style="--c:${c.deck.color};text-align:left"><div class="zh">${esc(c.zh)}</div> <span class="py">${esc(c.py)}</span><div class="ru" style="display:block">${esc(c.ru)}</div></div>`).join('')}`:''}
 <div class="row" style="justify-content:center"><button class="go" style="--c:#B0702A" id="again">⚡ Ещё раз</button><button class="ghost" onclick="history.back()">К темам</button></div></div>`;
 document.getElementById('again').onclick=()=>blitz(true)}
function settings(nopush){if(!nopush)go('set');const sizes=[[0.95,'A'],[1.15,'A'],[1.35,'A'],[1.6,'A'],[1.9,'A']];
 app.innerHTML=`<div class="set"><div class="lbl">Размер шрифта</div><div class="seg">${sizes.map((s,i)=>`<button data-k="${s[0]}" class="${S.k==s[0]?'on':''}" style="font-size:${14+i*3}px">${s[1]}</button>`).join('')}</div>
 <div class="lbl" style="margin-top:12px">Английский перевод</div><div class="seg"><button data-en="1" class="${S.en!==false?'on':''}">Показывать</button><button data-en="0" class="${S.en===false?'on':''}">Скрыть</button></div>
 <div class="lbl" style="margin-top:12px">Шрифт иероглифов</div><div class="seg" style="flex-wrap:wrap">${Object.entries(FONTS).map(([k,f])=>`<button data-f="${k}" class="${S.ff==k?'on':''}" style="font-family:${f[1].replace(/"/g,"'")}">${f[0]}</button>`).join('')}</div></div>
 <div class="card"><div class="lbl">пример</div><div class="ru">исполнять договор</div><div class="zh">履行合同</div><div class="py">lǚxíng hétong</div><div class="zs">双方应严格<b>履行</b>本合同。</div></div>
 <div class="help">Шрифты «Книжный», «Кистевой» и «Мягкий» загружаются из интернета при первом выборе.</div>`;
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.k=+b.dataset.k;save();applyLook();settings()});
 app.querySelectorAll('[data-en]').forEach(b=>b.onclick=()=>{S.en=b.dataset.en==='1';save();settings(true)});
 app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.ff=b.dataset.f;save();applyLook();settings()});scrollTo(0,0)}
function draw(){const c=cur,d=c.deck;if(c._dir===undefined||!shown)c._dir=S.dir=='mix'?(Math.random()<.5?'ru':'zh'):S.dir;const ruFirst=c._dir=='ru';
 const EN=(S.en!==false&&c.en)?`<div class="en">${esc(c.en)}</div>`:'';
 const RU=`<div class="lbl">по-русски</div><div class="ru">${esc(c.ru)}</div>${EN}${c.rs?`<div class="rs">${esc(c.rs)}</div>`:''}`;
 const ZH=`<div class="lbl">中文</div><div style="display:flex;align-items:center;gap:10px"><div class="zh">${esc(c.zh)}</div><button class="spk" id="spk">🔊</button></div>${c.py?`<div class="py">${esc(c.py)}</div>`:''}${c.scheme?`<div class="sch">${esc(c.scheme)}</div>`:''}${c.zs?`<div class="zs">${hl(c.zs,c.zh)}</div><div class="pyl">${esc(c.zsp)}</div>${c.zru?`<div class="zru">${esc(c.zru)}</div>`:''}`:''}`;
 const PARTS=c.parts?c.parts.map(p=>`<div class="part"><div class="w">${esc(p.w)} <span class="py" style="font-size:.6em">${esc(p.wpy)}</span></div>${S.en!==false?`<div class="en">${esc(p.en)}</div>`:''}<div class="rs">${esc(p.when)}</div><div style="margin-top:4px">${esc(p.col)}</div><div class="pyl">${esc(p.colpy)}</div><div class="exi"><div class="r">${esc(p.r)}</div><div class="z">${hl(p.z,p.w)}</div><div class="pyl">${esc(p.zp)}</div></div></div>`).join('')+(c.memo?`<div class="memo">💡 ${esc(c.memo)}</div>`:''):'';
 const NOTES=PARTS+`${c.det?`<div class="note det">${esc(c.det)}</div>`:''}${c.syn?`<div class="note syn">${esc(c.syn)}</div>`:''}${c.ant?`<div class="note ant">${esc(c.ant)}</div>`:''}${c.ref?`<div class="ref">📄 ${esc(c.ref)}</div>`:''}${exHtml(c)}`;
 const front=ruFirst?RU:ZH, back=ruFirst?ZH:RU;
 app.innerHTML=`<div class="top"><span style="color:${d.color};font-weight:600">${esc(d.title)}</span><span>осталось ${queue.length+1}</span></div>
 <div class="card" style="--c:${d.color}">${front}${shown?`<hr>${back}${NOTES}`:`<div class="hint">вспомните ${ruFirst?'по-китайски':'перевод'}</div>`}</div>
 <div class="ans">${shown?`<button class="no" id="no">Не знаю</button><button class="ok" id="ok">Знаю</button>`:`<button class="show" style="--c:${d.color}" id="sh">Показать</button>`}</div>`;
 const sp=document.getElementById('spk');if(sp)sp.onclick=e=>{e.stopPropagation();say(c.zh+'。'+(c.zs||''))};
 if(!shown)document.getElementById('sh').onclick=()=>{shown=true;draw()};
 else{document.getElementById('ok').onclick=()=>grade(true);document.getElementById('no').onclick=()=>grade(false)}}
function grade(ok){const id=cur.id;let b=S.box[id]||0;
 if(ok){b=Math.min(b+1,GAP.length-1);S.due[id]=today()+GAP[b]*DAY}else{b=0;S.due[id]=0;queue.splice(Math.min(3,queue.length),0,cur)}
 S.box[id]=b;save();next()}
function list(nopush){if(!nopush)go('list');let h=`<input type="search" id="q" placeholder="Поиск: русский, English, 汉字 или pinyin">`+`<div id="res"></div>`;app.innerHTML=h;
 const q=document.getElementById('q'),res=document.getElementById('res');
 const run=()=>{const t=q.value.trim().toLowerCase();const items=Object.values(ALL).filter(c=>!t||(c.ru+c.zh+c.py+c.rs+c.zs+(c.en||'')).toLowerCase().includes(t)).slice(0,150);
  res.innerHTML=items.map(c=>`<div class="li" style="--c:${c.deck.color}"><div class="zh">${esc(c.zh)}</div><span class="py"> ${esc(c.py)}</span><div class="ru" style="display:block;margin:2px 0">${esc(c.ru)}</div>${(S.en!==false&&c.en)?`<div class="en">${esc(c.en)}</div>`:''}${c.zs?`<div style="font-size:calc(var(--k)*15px)">${hl(c.zs,c.zh)}</div><div class="pyl">${esc(c.zsp)}</div>`:''}${c.syn?`<div class="note syn">${esc(c.syn)}</div>`:''}${c.ant?`<div class="note ant">${esc(c.ant)}</div>`:''}${c.ref?`<div class="ref">📄 ${esc(c.ref)}</div>`:''}${exHtml(c)}</div>`).join('')};
 q.oninput=run;run();scrollTo(0,0)}
function go(v,arg){try{const cur=(history.state||{}).v||'home';if(cur==='home')history.pushState({v:v,a:arg},'');else history.replaceState({v:v,a:arg},'')}catch(e){}}
window.addEventListener('popstate',e=>{clearInterval(bzTimer);if(window.HSK)HSK.stop();const s=e.state||{};if(s.v==='h'&&window.HSK){HSK.render(s.r);return}if(s.v==='list')list(true);else if(s.v==='set')settings(true);else if(s.v==='deck')start(s.a,true);else if(s.v==='blitz')blitz(true);else home()});
document.getElementById('homeBtn').onclick=()=>{const hs=history.state||{};if(hs.v==='h'){history.go(-(hs.d||1));return}if(((history.state||{}).v||'home')!=='home')history.back();else home()};document.getElementById('setBtn').onclick=()=>settings();document.getElementById('listBtn').onclick=()=>list();
try{history.replaceState({v:'home'},'')}catch(e){}
home();
</script><script>try{if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update());let done=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!done){done=true;location.reload()}})}}catch(e){}</script></body></html>
