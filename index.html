ка HSK 6", "color": "#2A7A7A", "cards": [{"ru": "считать … чем-то; принимать за …", "zh": "以……为……", "py": "yǐ … wéi …", "rs": "Преимущественную силу имеет текст на китайском языке.", "zs": "本合同以中文文本为准。", "syn": "", "det": "Книжное «считать A чем-то B / брать A за B». Частые готовые формы: 以 (yǐ)……为准 (wèizhǔn) (за основу/приоритет берётся), 以 (yǐ)……为主 (wéizhǔ) (главным образом), 以 (yǐ)……为例 (wèilì) (на примере), 以 (yǐ)……为荣 (wèiróng) (гордиться). В разговоре = 把 (bǎ)A当作 (dàngzuò)B.", "scheme": "以 + A + 为 + B", "ant": "", "ref": "", "en": "take A as B", "ex": [["我们以客户满意为目标。", "Наша цель — удовлетворённость клиента.", "wǒ men yǐ kè hù mǎn yì wèi mù biāo."], ["我们以质量为第一。", "Для нас качество — на первом месте.", "wǒ men yǐ zhì liàng wèi dì yī."], ["以中国为例，……", "На примере Китая …", "yǐ zhōng guó wèi lì, ……"], ["这家店以海鲜为主。", "Этот ресторан в основном про морепродукты.", "zhè jiā diàn yǐ hǎi xiān wéi zhǔ."]], "id": "gr-0", "zsp": "běn hé tóng yǐ zhōng wén wén běn wèi zhǔn."}, {"ru": "чем …, лучше …", "zh": "与其……不如……", "py": "yǔqí … bùrú …", "rs": "Чем ждать шанса, лучше действовать самому.", "zs": "与其等待机会，不如主动出击。", "syn": "", "det": "Сравнение двух вариантов: говорящий отвергает первый и выбирает второй. Часто с 还 (hái)/倒 (dào): 不如 (bùrú)……还好 (háihǎo). Нельзя менять части местами.", "scheme": "与其 + вариант 1，不如 + вариант 2", "ant": "", "ref": "", "en": "rather than A, better B", "ex": [["与其花钱修理，不如买台新的。", "Чем платить за ремонт, лучше купить новый.", "yǔ qí huā qián xiū lǐ, bù rú mǎi tái xīn de."], ["与其抱怨，不如行动。", "Чем жаловаться, лучше действовать.", "yǔ qí bào yuàn, bù rú xíng dòng."], ["与其坐车，不如走路去，反正不远。", "Чем ехать, лучше пешком — всё равно недалеко.", "yǔ qí zuò chē, bù rú zǒu lù qù, fǎn zhèng bù yuǎn."]], "id": "gr-1", "zsp": "yǔ qí děng dài jī huì, bù rú zhǔ dòng chū jī."}, {"ru": "лучше уж …, но не …", "zh": "宁可……也不……", "py": "nìngkě … yě bù …", "rs": "Лучше заработаю меньше, но подделку продавать не буду.", "zs": "我宁可少赚点，也不卖假货。", "syn": "", "det": "Выбор меньшего зла: готов на неприятное А, лишь бы не Б (也不 (yěbù)) или ради Б (也要 (yěyào)). Синоним: 宁愿 (nìngyuàn). Сильнее, чем 与其 (yǔqí)…不如 (bùrú).", "scheme": "宁可 + жертва，也不 + то, чего не хочешь / 也要 + цель", "ant": "", "ref": "", "en": "would rather … than …", "ex": [["他宁可熬夜，也要把翻译做完。", "Он готов не спать, лишь бы закончить перевод.", "tā nìng kě áo yè, yě yào bǎ fān yì zuò wán."], ["我宁可走路，也不坐他的车。", "Лучше пойду пешком, чем поеду в его машине.", "wǒ nìng kě zǒu lù, yě bù zuò tā de chē."], ["宁可多花钱，也要买质量好的。", "Пусть дороже, зато качественное.", "nìng kě duō huā qián, yě yào mǎi zhì liàng hǎo de."]], "id": "gr-2", "zsp": "wǒ nìng kě shǎo zhuàn diǎn, yě bù mài jiǎ huò."}, {"ru": "даже если …, всё равно …", "zh": "即使/哪怕……也……", "py": "jíshǐ / nǎpà … yě …", "rs": "Даже при форс-мажоре Сторона Б обязана своевременно уведомить Сторону А.", "zs": "即使遇到不可抗力，乙方也应及时通知甲方。", "syn": "", "det": "Уступка: «даже если (предположим) …, всё равно …». Условие нереальное или ещё не случилось. Сравни: 虽然 (suīrán)……但是 (dànshì) — факт уже есть. 哪怕 (nǎpà) разг., 即便 (jíbiàn) книжн., 纵然 (zòngrán) очень книжн.", "scheme": "即使 + гипотеза，(主语)也 + результат", "ant": "", "ref": "", "en": "even if", "ex": [["哪怕只有一线希望，我们也不放弃。", "Даже если надежды мало, мы не сдаёмся.", "nǎ pà zhǐ yǒu yī xiàn xī wàng, wǒ men yě bù fàng qì."], ["即使明天下雨，比赛也照常进行。", "Даже если завтра дождь, матч состоится.", "jí shǐ míng tiān xià yǔ, bǐ sài yě zhào cháng jìn xíng."], ["哪怕再忙，也要按时吃饭。", "Как бы ни был занят, ешь вовремя.", "nǎ pà zài máng, yě yào àn shí chī fàn."]], "id": "gr-3", "zsp": "jí shǐ yù dào bù kě kàng lì, yǐ fāng yě yīng jí shí tōng zhī jiǎ fāng."}, {"ru": "независимо от …, всё равно …", "zh": "无论/不管……都……", "py": "wúlùn / bùguǎn … dōu …", "rs": "При любых обстоятельствах стороны соблюдают соглашение.", "zs": "无论发生何种情况，双方都应遵守本协议。", "syn": "", "det": "Результат не зависит от условий. После 无论 (wúlùn) НЕ может стоять обычное утверждение: нужен 什么 (shénme)/谁 (shuí)/怎么 (zěnme)/多么 (duōme)/是否 (shìfǒu)/A还是 (háishì)B/A不 (bù)A. 不管 (bùguǎn) — разг.", "scheme": "无论 + вопрос. слово / A还是B / 多么…，都/也 + результат", "ant": "", "ref": "", "en": "no matter …", "ex": [["不管天气好不好，航班都会按时起飞。", "Независимо от погоды рейс вылетит вовремя.", "bù guǎn tiān qì hǎo bù hǎo, háng bān dū huì àn shí qǐ fēi."], ["无论你说什么，我都不会改变主意。", "Что бы ты ни сказал, я не передумаю.", "wú lùn nǐ shuō shén me, wǒ dōu bú huì gǎi biàn zhǔ yì."], ["不管是大公司还是小公司，都要依法纳税。", "И большие, и малые компании обязаны платить налоги.", "bù guǎn shì dà gōng sī hái shì xiǎo gōng sī, dōu yào yī fǎ nà shuì."]], "id": "gr-4", "zsp": "wú lùn fā shēng hé zhǒng qíng kuàng, shuāng fāng dōu yīng zūn shǒu běn xié yì."}, {"ru": "как только (вдруг) …, то …", "zh": "一旦……就……", "py": "yídàn … jiù …", "rs": "При обнаружении дефекта следует немедленно прекратить использование.", "zs": "一旦发现质量问题，应立即停止使用。", "syn": "", "det": "«Если вдруг / как только однажды …». Подчёркивает, что событие может наступить неожиданно и последствия серьёзны. Часто о рисках.", "scheme": "一旦 + (внезапное) событие，就 + последствие", "ant": "", "ref": "", "en": "once; in case", "ex": [["信任一旦失去，就很难恢复。", "Утраченное доверие трудно восстановить.", "xìn rèn yí dàn shī qù, jiù hěn nán huī fù."], ["一旦签了字，就不能反悔。", "Раз подписал — назад дороги нет.", "yí dàn qiān le zì, jiù bù néng fǎn huǐ."], ["一旦发现问题，请立即联系我们。", "Как только заметите проблему, сразу свяжитесь с нами.", "yí dàn fā xiàn wèn tí, qǐng lì jí lián xì wǒ men."]], "id": "gr-5", "zsp": "yí dàn fā xiàn zhì liàng wèn tí, yīng lì jí tíng zhǐ shǐ yòng."}, {"ru": "только если …, иначе …", "zh": "除非……否则……", "py": "chúfēi … fǒuzé …", "rs": "Если стороны не договорились иначе, договор прекращается по истечении срока.", "zs": "除非双方另有约定，否则合同期满自动终止。", "syn": "", "det": "«Только если А, иначе Б». Также 除非 (chúfēi)A，才 (cái)B — «только при А будет Б». Типично для договоров: 除非另有约定 (chúfēilìngyǒuyuēdìng).", "scheme": "除非 + единственное условие，否则 / 不然 + что будет без него", "ant": "", "ref": "", "en": "unless … otherwise …", "ex": [["除非你亲自去，否则这事办不成。", "Только если пойдёшь сам, иначе дело не выйдет.", "chú fēi nǐ qīn zì qù, fǒu zé zhè shì bàn bù chéng."], ["除非你提前预约，否则见不到经理。", "Без предварительной записи к менеджеру не попасть.", "chú fēi nǐ tí qián yù yuē, fǒu zé jiàn bú dào jīng lǐ."], ["除非下大雨，我才不去。", "Не пойду, только если будет ливень.", "chú fēi xià dà yǔ, wǒ cái bù qù."]], "id": "gr-6", "zsp": "chú fēi shuāng fāng lìng yǒu yuē dìng, fǒu zé hé tóng qī mǎn zì dòng zhōng zhǐ."}, {"ru": "причина того, что …, в том, что …", "zh": "之所以……是因为……", "py": "zhīsuǒyǐ … shì yīnwèi …", "rs": "Он добился успеха потому, что никогда не сдавался.", "zs": "他之所以成功，是因为他从不放弃。", "syn": "", "det": "Сначала результат, потом причина — подчёркивает ПРИЧИНУ. Обратный порядок: 因为 (yīnwèi)A，所以 (suǒyǐ)B. Частая ошибка — забыть 是 (shì).", "scheme": "(主语)之所以 + следствие，是因为 + причина", "ant": "", "ref": "", "en": "the reason why … is that …", "ex": [["之所以延误，是因为海关检查。", "Задержка произошла из-за таможенной проверки.", "zhī suǒ yǐ yán wù, shì yīn wèi hǎi guān jiǎn chá."], ["我之所以学中文，是因为工作需要。", "Я учу китайский потому, что это нужно по работе.", "wǒ zhī suǒ yǐ xué zhōng wén, shì yīn wèi gōng zuò xū yào."], ["他之所以迟到，是因为路上堵车。", "Он опоздал из-за пробки.", "tā zhī suǒ yǐ chí dào, shì yīn wèi lù shàng dǔ chē."]], "id": "gr-7", "zsp": "tā zhī suǒ yǐ chéng gōng, shì yīn wèi tā cóng bù fàng qì."}, {"ru": "раз уж …, то …", "zh": "既然……就……", "py": "jìrán … jiù …", "rs": "Раз подписали договор — надо исполнять.", "zs": "既然签了合同，就要履行。", "syn": "", "det": "«Раз уж …, то …». Факт уже признан обеими сторонами, вывод — совет или решение. Сравни 因为 (yīnwèi) — просто причина.", "scheme": "既然 + известный факт，就 + вывод/предложение", "ant": "", "ref": "", "en": "since; now that", "ex": [["既然你决定了，我就不反对了。", "Раз ты решил, я не возражаю.", "jì rán nǐ jué dìng le, wǒ jiù bù fǎn duì le."], ["既然来了，就多住几天吧。", "Раз уж приехал, поживи подольше.", "jì rán lái le, jiù duō zhù jǐ tiān ba."], ["既然大家都同意，我们就开始吧。", "Раз все согласны — начинаем.", "jì rán dà jiā dōu tóng yì, wǒ men jiù kāi shǐ ba."]], "id": "gr-8", "zsp": "jì rán qiān le hé tóng, jiù yào lǚ xíng."}, {"ru": "тем более; к тому же", "zh": "何况 / 况且", "py": "hékuàng / kuàngqiě", "rs": "Даже специалисты не решили, а уж мы тем более.", "zs": "专家都解决不了，何况我们呢？", "syn": "", "det": "何况 (hékuàng) — «а уж тем более» (B ещё очевиднее; часто риторический вопрос с 呢 (ne)). 况且 (kuàngqiě) — «к тому же», просто добавляет довод, без сравнения.", "scheme": "A都……，何况B呢？ / 理由1，况且 + 理由2", "ant": "", "ref": "", "en": "let alone / besides", "ex": [["时间来不及了，况且也没有预算。", "Время поджимает, к тому же нет бюджета.", "shí jiān lái bù jí le, kuàng qiě yě méi yǒu yù suàn."], ["这道题老师都不会，何况学生呢？", "Это задание и учитель не решит, а уж ученик тем более.", "zhè dào tí lǎo shī dōu bú huì, hé kuàng xué shēng ne?"], ["天太晚了，况且还下着雨，别走了。", "Уже поздно, к тому же дождь — оставайся.", "tiān tài wǎn le, kuàng qiě hái xià zhe yǔ, bié zǒu le."]], "id": "gr-9", "zsp": "zhuān jiā dōu jiě jué bù liǎo, hé kuàng wǒ men ne?"}, {"ru": "чтобы (облегчить) / чтобы не", "zh": "以便 / 以免", "py": "yǐbiàn / yǐmiǎn", "rs": "Сообщите заранее, чтобы мы могли организовать транспорт.", "zs": "请提前通知，以便我方安排车辆。", "syn": "", "det": "Обе стоят во второй части. 以便 (yǐbiàn) — «чтобы было удобно, получилось»; 以免 (yǐmiǎn) = 免得 (miǎnde) — «чтобы не случилось плохое».", "scheme": "действие，以便 + желаемое / 以免 + нежелательное", "ant": "", "ref": "", "en": "so that / lest", "ex": [["请妥善保管单据，以免遗失。", "Храните документы бережно, чтобы не потерять.", "qǐng tuǒ shàn bǎo guǎn dān jù, yǐ miǎn yí shī."], ["请写清地址，以便及时送货。", "Напишите адрес чётко, чтобы доставили вовремя.", "qǐng xiě qīng dì zhǐ, yǐ biàn jí shí sòng huò."], ["请保存好合同原件，以免丢失。", "Храните оригинал договора, чтобы не потерять.", "qǐng bǎo cún hǎo hé tóng yuán jiàn, yǐ miǎn diū shī."]], "id": "gr-10", "zsp": "qǐng tí qián tōng zhī, yǐ biàn wǒ fāng ān pái chē liàng."}, {"ru": "не обязательно, вряд ли", "zh": "未必 / 不见得", "py": "wèibì / bú jiàndé", "rs": "Низкая цена не обязательно значит плохое качество.", "zs": "价格低未必质量差。", "syn": "", "det": "Смягчённое отрицание: «не обязательно, вряд ли». Звучит вежливо, оставляет шанс. 未必 (wèibì) книжн., 不见得 (bújiànde) разг. Сравни 一定不 (yídìngbù) — категорично.", "scheme": "未必 / 不见得 + сказуемое", "ant": "", "ref": "", "en": "not necessarily", "ex": [["他不见得会同意。", "Вряд ли он согласится.", "tā bú jiàn de huì tóng yì."], ["贵的东西未必好。", "Дорогое не обязательно хорошее.", "guì de dōng xī wèi bì hǎo."], ["他说的不见得对。", "Не факт, что он прав.", "tā shuō de bú jiàn de duì."]], "id": "gr-11", "zsp": "jià gé dī wèi bì zhì liàng chà."}, {"ru": "неизбежно, трудно избежать", "zh": "难免 / 不免", "py": "nánmiǎn / bùmiǎn", "rs": "Новичкам трудно избежать ошибок.", "zs": "初学者难免犯错误。", "syn": "", "det": "«Неизбежно, трудно избежать». 难免 (nánmiǎn) — может быть сказуемым: 这是难免的 (zhèshìnánmiǎnde). 不免 (bùmiǎn) — только наречие перед глаголом, о невольном чувстве.", "scheme": "难免 + V / 是难免的；不免 + V", "ant": "", "ref": "", "en": "inevitably", "ex": [["想到明天的考试，他不免有些紧张。", "Думая о завтрашнем экзамене, он невольно нервничает.", "xiǎng dào míng tiān de kǎo shì, tā bù miǎn yǒu xiē jǐn zhāng."], ["第一次做难免会紧张。", "В первый раз волноваться неизбежно.", "dì yī cì zuò nán miǎn huì jǐn zhāng."], ["看到老照片，他不免有些伤感。", "Глядя на старые фото, он невольно загрустил.", "kàn dào lǎo zhào piān, tā bù miǎn yǒu xiē shāng gǎn."]], "id": "gr-12", "zsp": "chū xué zhě nán miǎn fàn cuò wù."}, {"ru": "не дойдёт до того, чтобы", "zh": "不至于", "py": "bú zhìyú", "rs": "Мелочь, на весь проект не повлияет.", "zs": "只是小问题，不至于影响整个项目。", "syn": "", "det": "«Не дойдёт до того, чтобы …». Отрицает крайний, преувеличенный вариант. Вопрос «不至于吧 (bùzhìyúba)？» = «Да ладно, не до такой же степени?»", "scheme": "(还)不至于 + крайняя степень", "ant": "", "ref": "", "en": "not to the extent of", "ex": [["他再忙也不至于连电话都不接。", "Как бы ни был занят, не до такой степени, чтобы не брать трубку.", "tā zài máng yě bù zhì yú lián diàn huà dōu bù jiē."], ["虽然有点累，但不至于病倒。", "Устал, но не до болезни.", "suī rán yǒu diǎn lèi, dàn bù zhì yú bìng dào."], ["这点小错误不至于被开除吧？", "За такую мелочь ведь не уволят?", "zhè diǎn xiǎo cuò wù bù zhì yú bèi kāi chú ba?"]], "id": "gr-13", "zsp": "zhǐ shì xiǎo wèn tí, bù zhì yú yǐng xiǎng zhěng gè xiàng mù."}, {"ru": "зачем же? / разве (не)?", "zh": "何必 / 何尝", "py": "hébì / hécháng", "rs": "Зачем злиться из-за пустяка?", "zs": "何必为这点小事生气？", "syn": "", "det": "Риторические вопросы. 何必 (hébì) = «зачем же?» (= 不必 (bùbì)). 何尝 (hécháng) = «разве когда-то?» — 何尝不想 (héchángbùxiǎng) = «на самом деле тоже хочу».", "scheme": "何必 + V(呢)？ / 何尝不 + V", "ant": "", "ref": "", "en": "why bother / hasn't … too", "ex": [["我何尝不想休息，可是工作太多。", "Разве я не хочу отдохнуть? Но работы слишком много.", "wǒ hé cháng bù xiǎng xiū xī, kě shì gōng zuò tài duō."], ["都是朋友，何必客气？", "Мы же друзья, зачем церемонии?", "dōu shì péng yǒu, hé bì kè qì?"], ["我何尝不想早点下班？", "Будто я не хочу уйти пораньше!", "wǒ hé cháng bù xiǎng zǎo diǎn xià bān?"]], "id": "gr-14", "zsp": "hé bì wèi zhè diǎn xiǎo shì shēng qì?"}, {"ru": "что касается …; с точки зрения …", "zh": "就……而言", "py": "jiù … ér yán", "rs": "По цене эта компания самая выгодная.", "zs": "就价格而言，这家公司最有优势。", "syn": "", "det": "«Что касается …; с точки зрения …». Сужает рассмотрение до одного аспекта. 对 (duì)……来说 (láishuō) — разг., 就 (jiù)……而言 (éryán) — книжн.", "scheme": "就 / 对 + тема + 而言 / 来说", "ant": "", "ref": "", "en": "as far as … is concerned", "ex": [["对翻译而言，准确比速度更重要。", "Для перевода точность важнее скорости.", "duì fān yì ér yán, zhǔn què bǐ sù dù gèng zhòng yào."], ["就质量而言，这款最好。", "По качеству эта модель лучшая.", "jiù zhì liàng ér yán, zhè kuǎn zuì hǎo."], ["对我来说，语法比词汇难。", "Для меня грамматика труднее слов.", "duì wǒ lái shuō, yǔ fǎ bǐ cí huì nán."]], "id": "gr-15", "zsp": "jiù jià gé ér yán, zhè jiā gōng sī zuì yǒu yōu shì."}, {"ru": "при …; под …; при условии …", "zh": "在……下 / 在……的前提下", "py": "zài … xià", "rs": "Совместными усилиями сторон проект успешно завершён.", "zs": "在双方的共同努力下，项目顺利完成。", "syn": "", "det": "在 (zài)……下 (xià): «при / под (влиянием, руководством, помощью)»: 在他的帮助下 (zàitādebāngzhùxià). 在 (zài)……的前提下 (deqiántíxià): «при условии, что …».", "scheme": "在 + сущ. + 下 / 在……的前提下", "ant": "", "ref": "", "en": "under / on condition that", "ex": [["在不违反法律的前提下，双方可另行约定。", "При условии, что это не нарушает закон, стороны могут договориться отдельно.", "zài bù wéi fǎn fǎ lǜ de qián tí xià, shuāng fāng kě lìng xíng yuē dìng."], ["在老师的指导下，我的中文进步很快。", "Под руководством учителя мой китайский быстро растёт.", "zài lǎo shī de zhǐ dǎo xià, wǒ de zhōng wén jìn bù hěn kuài."], ["在保证质量的前提下降低成本。", "Снижать затраты при условии сохранения качества.", "zài bǎo zhèng zhì liàng de qián tí xià jiàng dī chéng běn."]], "id": "gr-16", "zsp": "zài shuāng fāng de gòng tóng nǔ lì xià, xiàng mù shùn lì wán chéng."}, {"ru": "подвергнуть …, осуществить …", "zh": "予以 / 加以 + двусложный глагол", "py": "yǔyǐ / jiāyǐ", "rs": "Отличившиеся сотрудники поощряются.", "zs": "对表现突出的员工予以奖励。", "syn": "", "det": "Книжные «служебные» глаголы. Объект ставят ПЕРЕД ними: 对 (duì)……予以 (yǔyǐ)/加以 (jiāyǐ) + V. 予以 (yǔyǐ) — решения власти (批准 (pīzhǔn)、处罚 (chǔfá)、支持 (zhīchí)、答复 (dáfù)). 加以 (jiāyǐ) — обработка (分析 (fēnxī)、研究 (yánjiū)、改进 (gǎijìn)、说明 (shuōmíng)). Ошибка: 予以帮助他 (yǔyǐbāngzhùtā) ✗ → 对他予以帮助 (duìtāyǔyǐbāngzhù) ✓.", "scheme": "予以 / 加以 + 2-сложный глагол (без дополнения)", "ant": "", "ref": "", "en": "give / subject to", "ex": [["对上述问题必须加以解决。", "Перечисленные проблемы должны быть решены.", "duì shàng shù wèn tí bì xū jiā yǐ jiě jué."], ["对此问题，公司将予以答复。", "Компания даст ответ по этому вопросу.", "duì cǐ wèn tí, gōng sī jiāng yǔ yǐ dá fù."], ["对数据要加以分析。", "Данные нужно проанализировать.", "duì shù jù yào jiā yǐ fēn xī."]], "id": "gr-17", "zsp": "duì biǎo xiàn tū chū de yuán gōng yǔ yǐ jiǎng lì."}, {"ru": "возлагается на …; … несёт", "zh": "由……承担 / 负责", "py": "yóu … chéngdān / fùzé", "rs": "Все возникающие из этого расходы несёт Сторона Б.", "zs": "由此产生的一切费用由乙方承担。", "syn": "", "det": "由 (yóu) указывает того, КТО делает/отвечает. Не путать с 被 (bèi) (пассив). 由 (yóu)……组成 (zǔchéng) — «состоит из».", "scheme": "由 + исполнитель + 承担/负责/决定/组成", "ant": "", "ref": "", "en": "by (someone responsible)", "ex": [["会议由总经理主持。", "Совещание проводит генеральный директор.", "huì yì yóu zǒng jīng lǐ zhǔ chí."], ["此事由我负责。", "За это отвечаю я.", "cǐ shì yóu wǒ fù zé."], ["委员会由五人组成。", "Комиссия состоит из пяти человек.", "wěi yuán huì yóu wǔ rén zǔ chéng."]], "id": "gr-18", "zsp": "yóu cǐ chǎn shēng de yī qiè fèi yòng yóu yǐ fāng chéng dān."}, {"ru": "модальность в документах", "zh": "应 / 须 / 不得 / 可", "py": "yīng / xū / bùdé / kě", "rs": "Без письменного согласия Стороны А Сторона Б не вправе передавать договор.", "zs": "未经甲方书面同意，乙方不得转让本合同。", "syn": "", "det": "应 (yīng)(当 (dāng)) — должен (обязанность); 须 (xū) / 必须 (bìxū) — обязан (строже); 不得 (bùdé) — запрещено; 可 (kě) / 有权 (yǒuquán) — вправе; 均 (jūn) — все. Вне документов говорят 应该 (yīnggāi)、必须 (bìxū)、不能 (bùnéng)、可以 (kěyǐ).", "scheme": "модальные слова документов", "ant": "", "ref": "", "en": "shall / must / shall not / may", "ex": [["双方均可提出修改意见。", "Обе стороны могут вносить предложения по изменению.", "shuāng fāng jūn kě tí chū xiū gǎi yì jiàn."], ["乘客应系好安全带。", "Пассажиры должны пристегнуть ремни.", "chéng kè yīng jì hǎo ān quán dài."], ["未成年人不得饮酒。", "Несовершеннолетним запрещено пить алкоголь.", "wèi chéng nián rén bù dé yǐn jiǔ."]], "id": "gr-19", "zsp": "wèi jīng jiǎ fāng shū miàn tóng yì, yǐ fāng bù dé zhuǎn ràng běn hé tóng."}, {"ru": "если …, то … (книжн.)", "zh": "如……，则……", "py": "rú …, zé …", "rs": "Если Сторона Б не поставит товар в срок, Сторона А вправе расторгнуть договор.", "zs": "如乙方未按期交货，则甲方有权解除合同。", "syn": "", "det": "Книжное «если …, то …» (= 如果 (rúguǒ)……就 (jiù)……). 则 (zé) стоит ПЕРЕД глаголом второй части, после подлежащего не нужен.", "scheme": "如 / 若 + условие，则 + следствие", "ant": "", "ref": "", "en": "if …, then …", "ex": [["若有异议，请于三日内提出。", "При наличии возражений заявите в течение трёх дней.", "ruò yǒu yì yì, qǐng yú sān rì nèi tí chū."], ["如有疑问，请与我们联系。", "При вопросах свяжитесь с нами.", "rú yǒu yí wèn, qǐng yǔ wǒ men lián xì."], ["若不及时处理，则后果严重。", "Если не решить вовремя — последствия будут серьёзные.", "ruò bù jí shí chǔ lǐ, zé hòu guǒ yán zhòng."]], "id": "gr-20", "zsp": "rú yǐ fāng wèi àn qī jiāo huò, zé jiǎ fāng yǒu quán jiě chú hé tóng."}, {"ru": "всё, что …; любой …", "zh": "凡（是）……都/均……", "py": "fán(shì) … dōu/jūn …", "rs": "Вопросы, не урегулированные договором, решаются дополнительно.", "zs": "凡本合同未尽事宜，双方另行协商。", "syn": "", "det": "«Всё, что …; каждый, кто …» — обобщение без исключений. В документах: 凡 (fán)……均 (jūn)…….", "scheme": "凡（是）+ категория，都/均/一律 + …", "ant": "", "ref": "", "en": "all; every", "ex": [["凡是参加比赛的人都有纪念品。", "Все участники соревнования получат сувенир.", "fán shì cān jiā bǐ sài de rén dōu yǒu jì niàn pǐn."], ["凡是迟到的人都要罚款。", "Все опоздавшие платят штраф.", "fán shì chí dào de rén dōu yào fá kuǎn."], ["凡购物满百元，均可参加抽奖。", "Каждый, кто купил на 100 юаней, участвует в розыгрыше.", "fán gòu wù mǎn bǎi yuán, jūn kě cān jiā chōu jiǎng."]], "id": "gr-21", "zsp": "fán běn hé tóng wèi jǐn shì yí, shuāng fāng lìng xíng xié shāng."}, {"ru": "обязательно надо; без … никак", "zh": "非……不可", "py": "fēi … bùkě", "rs": "Это дело непременно должен решить ты сам.", "zs": "这件事非你亲自处理不可。", "syn": "", "det": "Двойное отрицание = сильное «обязательно, никак без …». Может выражать и необходимость, и решимость, и неизбежность.", "scheme": "非 + V/сущ. + 不可 / 不行", "ant": "", "ref": "", "en": "must; have to", "ex": [["要通过HSK6，非下苦功夫不可。", "Чтобы сдать HSK 6, без упорного труда никак.", "yào tōng guò H S K 6, fēi xià kǔ gōng fu bù kě."], ["这件事非他不可。", "Без него это дело не сделать.", "zhè jiàn shì fēi tā bù kě."], ["你这样下去，非生病不可。", "Так дальше — непременно заболеешь.", "nǐ zhè yàng xià qù, fēi shēng bìng bù kě."]], "id": "gr-22", "zsp": "zhè jiàn shì fēi nǐ qīn zì chǔ lǐ bù kě."}, {"ru": "не жалея, не останавливаясь перед", "zh": "不惜", "py": "bùxī", "rs": "Компания не жалеет денег на привлечение талантов.", "zs": "公司不惜重金引进人才。", "syn": "", "det": "«Не жалея, не останавливаясь перед …». Объект — 代价 (dàijià)、一切 (yīqiè)、重金 (zhòngjīn)、时间 (shíjiān)、生命 (shēngmìng).", "scheme": "不惜 + цена/жертва (+ 也要 + цель)", "ant": "", "ref": "", "en": "spare no …", "ex": [["他不惜一切代价也要赢。", "Он хочет выиграть любой ценой.", "tā bù xī yí qiè dài jià yě yào yíng."], ["他不惜一切代价救孩子。", "Он любой ценой спасал ребёнка.", "tā bù xī yí qiè dài jià jiù hái zi."], ["为了市场，公司不惜降价。", "Ради рынка компания пошла даже на снижение цен.", "wèi le shì chǎng, gōng sī bù xī jiàng jià."]], "id": "gr-23", "zsp": "gōng sī bù xī zhòng jīn yǐn jìn rén cái."}, {"ru": "так что; вплоть до / что привело к (плохому)", "zh": "以至（于）/ 以致", "py": "yǐzhì(yú) / yǐzhì", "rs": "Он так увлёкся работой, что забыл поесть.", "zs": "他工作太投入，以至于忘了吃饭。", "syn": "", "det": "以至 (yǐzhì) — «так что, вплоть до» (любой результат). 以致 (yǐzhì) — только ПЛОХОЙ результат. См. «Похожие слова».", "scheme": "причина，以至(于) / 以致 + результат", "ant": "", "ref": "", "en": "so that / resulting in", "ex": [["由于管理不善，以致公司亏损。", "Из-за плохого управления компания понесла убытки.", "yóu yú guǎn lǐ bù shàn, yǐ zhì gōng sī kuī sǔn."], ["他太紧张，以至于说不出话来。", "Он так волновался, что не мог говорить.", "tā tài jǐn zhāng, yǐ zhì yú shuō bù chū huà lái."], ["管理混乱，以致损失严重。", "Хаос в управлении привёл к серьёзным потерям.", "guǎn lǐ hùn luàn, yǐ zhì sǔn shī yán zhòng."]], "id": "gr-24", "zsp": "tā gōng zuò tài tóu rù, yǐ zhì yú wàng le chī fàn."}, {"ru": "вовсе не", "zh": "并非 / 并不", "py": "bìngfēi / bìng bù", "rs": "Это вовсе не то, что я имел в виду.", "zs": "这并非我的本意。", "syn": "", "det": "并 (bìng) усиливает отрицание, ОПРОВЕРГАЕТ ожидание собеседника: «вовсе не (как ты думаешь)». 并非 (bìngfēi) = 并不是 (bìngbúshì) (книжн.).", "scheme": "并 + 不/没/非 + сказуемое", "ant": "", "ref": "", "en": "not at all (contrary to expectation)", "ex": [["问题并不像你想的那么简单。", "Проблема вовсе не так проста, как ты думаешь.", "wèn tí bìng bù xiàng nǐ xiǎng de nà me jiǎn dān."], ["学中文并不像想象中那么难。", "Китайский учить вовсе не так трудно, как кажется.", "xué
