 app.innerHTML=`<div class="top"><span style="color:${d.color};font-weight:600">${esc(d.title)}</span><span>осталось ${queue.length+1}</span></div>
 <div class="card" style="--c:${d.color}">${front}${shown?`<hr>${back}${NOTES}`:`<div class="hint">вспомните ${ruFirst?'по-китайски':'перевод'}</div>`}</div>
 <div class="ans">${shown?`<button class="no" id="no">Не знаю</button><button class="ok" id="ok">Знаю</button>`:`<button class="show" style="--c:${d.color}" id="sh">Показать</button>`}</div>`;
 const sp=document.getElementById('spk');if(sp)sp.onclick=e=>{e.stopPropagation();say(c.zh+'。'+(c.zs||''))};
 if(!shown)document.getElementById('sh').onclick=()=>{shown=true;draw()};
 else{document.getElementById('ok').onclick=()=>grade(true);document.getElementById('no').onclick=()=>grade(false)}}
function grade(ok){const id=cur.id;let b=S.box[id]||0;
 if(ok){b=Math.min(b+1,GAP.length-1);S.due[id]=today()+GAP[b]*DAY}else{b=0;S.due[id]=0;queue.splice(Math.min(3,queue.length),0,cur)}
 S.box[id]=b;save();next()}
function list(){let h=`<input type="search" id="q" placeholder="Поиск: русское слово, 汉字 или pinyin">`+`<div id="res"></div>`;app.innerHTML=h;
 const q=document.getElementById('q'),res=document.getElementById('res');
 const run=()=>{const t=q.value.trim().toLowerCase();const items=Object.values(ALL).filter(c=>!t||(c.ru+c.zh+c.py+c.rs+c.zs).toLowerCase().includes(t)).slice(0,150);
  res.innerHTML=items.map(c=>`<div class="li" style="--c:${c.deck.color}"><div class="zh">${esc(c.zh)}</div><span class="py"> ${esc(c.py)}</span><div class="ru" style="display:block;margin:2px 0">${esc(c.ru)}</div>${c.zs?`<div style="font-size:calc(var(--k)*15px)">${hl(c.zs,c.zh)}</div>`:''}${c.syn?`<div class="note syn">${esc(c.syn)}</div>`:''}${c.ant?`<div class="note ant">${esc(c.ant)}</div>`:''}${c.ref?`<div class="ref">📄 ${esc(c.ref)}</div>`:''}${exHtml(c)}</div>`).join('')};
 q.oninput=run;run();scrollTo(0,0)}
document.getElementById('homeBtn').onclick=home;document.getElementById('setBtn').onclick=settings;document.getElementById('listBtn').onclick=list;
home();
